; RP2350-Zero (Waveshare) + SSD1309 128x64 over SPI, controlled via USB vendor bulk endpoints.
; Uses the community arduino-pico core (Earle Philhower) which supports RP2350 + Adafruit TinyUSB.

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
build_flags =
    -DUSE_TINYUSB
monitor_speed = 115200
